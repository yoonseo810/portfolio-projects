name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Install Chromium for Storybook tests
        run: pnpm --filter design-system exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: e2e + Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the apps under test
        run: pnpm turbo run build --filter=portfolio --filter=data-explorer --filter=kiosk
      - name: Install Chromium
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: End-to-end tests, then Lighthouse budgets
        run: pnpm --filter e2e e2e
        env:
          CI: true
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            packages/e2e/playwright-report/
            packages/e2e/lighthouse-report/
          retention-days: 14
